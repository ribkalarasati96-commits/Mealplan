.wrow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;}

 1:'🌱 Konsistensi lebih penting dari intensitas! Jangan paksa tubuh terlalu keras.<br>🍽️ Kunyah makanan pelan-pelan minimal 20× per suap — bikin kenyang lebih lama.<br>😴 Tidur 7–8 jam sangat penting untuk metabolisme dan kontrol nafsu makan.<br>📱 Foto makananmu setiap hari sebagai catatan progres!',
 2:'🔥 Tubuhmu sudah mulai terbiasa — jaga konsistensi defisit kalori!<br>💪 Workout mulai terasa ringan? Itu tanda progres. Tingkatkan sedikit-sedikit.<br>🧘 Kelola stres — kortisol tinggi = susah turun berat badan.<br>💧 Sering merasa lapar padahal baru makan? Coba minum air dulu!',
 3:'⚡ Kamu sudah luar biasa! Tubuh mulai terlihat berubah nyata.<br>📏 Ukur lingkar pinggang & pinggul tiap 2 minggu — bukan cuma timbangan.<br>🏃 Treadmill bisa sedikit dimiringkan (incline 2–3%) untuk intensitas lebih.<br>🎯 Ada plateau? Normal! Tetap konsisten dan percaya prosesnya.',
 4:'🏆 Selesaikan kuat! Kamu sudah capai lebih dari yang kamu bayangkan.<br>🌟 Rayakan setiap 5 kg yang turun — apresiasi dirimu sendiri!<br>🔄 Mulai pikirkan maintenance plan agar tidak yo-yo setelah Desember.<br>📏 Timbang berat badan 1× seminggu saja, pagi setelah buang air kecil.'

// ── STATE ──
var cP=0, cD=1, wC=0;

function dow(pi,d){return (SD[PH[pi].month]+d-1)%7;}
function getMeal(pi,d){var dw=dow(pi,d);return PH[pi].phase===1?M1[dw]:M2[dw];}
function getWk(pi,d){var dw=dow(pi,d);var ph=PH[pi].phase;var wk=WK[dw];if(!wk)return null;return wk['p'+ph]||wk.p1;}

function mc(m,lbl,col){
  var b=m.b.map(function(x){return '<li><span class="qty">'+x.q+'</span><span>'+x.n+'</span></li>';}).join('');
  var s=m.s.map(function(x,i){return '<div class="step"><div class="snum">'+(i+1)+'</div><div>'+x+'</div></div>';}).join('');
  return '<span class="mbadge" style="background:'+col+'22;color:'+col+'">'+lbl+'</span>'+
    '<div class="mname">'+m.i+' '+m.n+(m.c?' <span class="mcal">±'+m.c+' kkal</span>':'')+'</div>'+
    '<ul class="ings">'+b+'</ul><div class="steps">'+s+'</div>';
}

function draw(){
  // Phase nav
  var ph='';
  for(var i=0;i<PH.length;i++){
    ph+='<button class="pbtn'+(i===cP?' act':'')+'" data-i="'+i+'">'+PH[i].label+' <small style="opacity:.7">F'+PH[i].phase+'</small></button>';
  }
  document.getElementById('PN').innerHTML=ph;

  // Day nav
  var dn='';
  for(var d=1;d<=PH[cP].days;d++){
    dn+='<button class="dbtn'+(d===cD?' act':'')+'" data-d="'+d+'">'+d+'</button>';
  }
  document.getElementById('DN').innerHTML=dn;

  // Scroll active day into view
  var ada=document.querySelector('.dbtn.act');
  if(ada)ada.scrollIntoView({inline:'center',behavior:'smooth',block:'nearest'});

  // Content
  var p=PH[cP],ph2=p.phase,dw2=dow(cP,cD),dn2=DN[dw2];
  var ds=dn2+', '+cD+' '+MNF[p.month]+' 2026';
  var wk=Math.ceil(cD/7);
  var meal=getMeal(cP,cD),wout=getWk(cP,cD);
  var tc=(meal.sar.c||0)+(meal.sia.c||0)+(meal.mal.c||0)+150;
  var pcol=PC[ph2];

  var snkH='<div class="snackbox"><strong>🕙 Snack Pagi (±Jam 10.00):</strong> '+meal.snk.i+' '+meal.snk.n+'<br>'+
    '<span>Bahan: '+meal.snk.b.map(function(x){return x.q+' '+x.n;}).join(', ')+'</span><br>'+
    '<span>'+meal.snk.s[0]+'</span></div>';

  var wkH;
  if(!wout){
    wkH='<div class="wbox"><h3>💪 Workout Hari Ini</h3>'+
      '<div style="font-size:.82rem;opacity:.85">😴 <strong>Hari Istirahat Aktif</strong><br>Lakukan stretching ringan 10 menit atau jalan santai di treadmill 10 menit. Tubuh butuh recovery untuk tumbuh lebih kuat!</div></div>';
  } else {
    var wi=wout.w.map(function(x){return '<div class="witem"><div class="wdot"></div><div>'+x+'</div></div>';}).join('');
    wkH='<div class="wbox"><h3>💪 Workout Hari Ini</h3>'+
      '<div style="font-size:.77rem;font-weight:600;opacity:.8;margin-bottom:6px">'+wout.t+'</div>'+wi+
      '<a class="wlink" href="'+wout.lk+'" target="_blank">'+wout.lb+' ↗</a>'+
      '<div style="font-size:.69rem;opacity:.7;margin-top:8px">💡 Klik untuk cari video di YouTube. Pilih yang sesuai kemampuanmu hari ini.</div></div>';
  }

  var gH='';for(var g=1;g<=8;g++)gH+='<span class="wg" data-g="'+g+'">'+(g<=wC?'💧':'🥛')+'</span>';

  var pd=cP===0&&cD===1,nd=cP===PH.length-1&&cD===PH[cP].days;

  document.getElementById('CT').innerHTML=
    '<div class="date-hdr">'+
      '<div><h2>'+ds+'</h2><div class="dsub">Minggu ke-'+wk+' · Fase '+ph2+' — '+(ph2===1?'Adaptasi':ph2===2?'Pembakaran':ph2===3?'Penguatan':'Finishing')+'</div></div>'+
      '<div class="ccal"><div class="n">~'+tc+'</div><div class="l">kkal/hari</div></div>'+
    '</div>'+
    '<div class="pinfo" style="background:linear-gradient(135deg,'+pcol+'ee,'+pcol+'aa)">'+
      '<h3>📌 Fase '+ph2+'</h3><p>'+PD[ph2]+'</p></div>'+
    '<div class="card">'+
      '<div class="chdr"><div class="cico" style="background:#f0fdf4">🍽️</div><div><div class="ctit">Meal Plan Hari Ini</div><div class="csub">Masak pakai kukusan & wajan — simple!</div></div></div>'+
      '<div class="cbody">'+mc(meal.sar,'Sarapan','#f59e0b')+'<hr class="divid">'+snkH+mc(meal.sia,'Makan Siang','#10b981')+'<hr class="divid">'+mc(meal.mal,'Makan Malam','#3b82f6')+
      '<div class="tipbox">💧 <strong>Air minum:</strong> 1 gelas sebelum tiap makan. Total 8 gelas/hari.<br>🕗 <strong>Jadwal:</strong> Sarapan 07.00 · Snack 10.00 · Siang 12.00 · Malam 18.00<br>🚫 <strong>Stop makan</strong> setelah jam 20.00</div></div></div>'+
    '<div class="card">'+
      '<div class="chdr"><div class="cico" style="background:#e0f2fe">💧</div><div><div class="ctit">Tracker Air Minum</div><div class="csub">Ketuk gelas untuk tandai sudah minum</div></div></div>'+
      '<div class="cbody"><div class="wrow">'+gH+'</div><div class="wcnt" id="WC">'+wC+' / 8 gelas '+(wC>=8?'🎉 Target tercapai!':'')+'</div></div></div>'+
    wkH+
    '<div class="card">'+
      '<div class="chdr"><div class="cico" style="background:#fef9ee">💡</div><div><div class="ctit">Tips Hari Ini</div></div></div>'+
      '<div class="cbody" style="font-size:.81rem;line-height:1.8">'+TIPS[ph2]+'</div></div>'+
    '<div class="navrow">'+
      '<button class="navbtn" id="BP"'+(pd?' disabled':'')+'>← Sebelumnya</button>'+
      '<button class="navbtn" id="BN"'+(nd?' disabled':'')+'>Berikutnya →</button>'+
    '</div>';

  // Attach events
  document.getElementById('PN').querySelectorAll('.pbtn').forEach(function(b){
    b.addEventListener('click',function(){cP=parseInt(this.getAttribute('data-i'));cD=1;wC=0;draw();window.scrollTo(0,0);});
  });
  document.getElementById('DN').querySelectorAll('.dbtn').forEach(function(b){
    b.addEventListener('click',function(){cD=parseInt(this.getAttribute('data-d'));wC=0;draw();window.scrollTo(0,0);});
  });
  document.querySelectorAll('.wg').forEach(function(b){
    b.addEventListener('click',function(){
      var n=parseInt(this.getAttribute('data-g'));
      wC=(n<=wC)?n-1:n;
      document.querySelectorAll('.wg').forEach(function(g,i){g.textContent=(i+1)<=wC?'💧':'🥛';});
      document.getElementById('WC').textContent=wC+' / 8 gelas '+(wC>=8?'🎉 Target tercapai!':'');
    });
  });
  var bp=document.getElementById('BP'),bn=document.getElementById('BN');
  if(bp)bp.addEventListener('click',function(){
    if(cD>1)cD--;else if(cP>0){cP--;cD=PH[cP].days;}
    wC=0;draw();window.scrollTo(0,0);
  });
  if(bn)bn.addEventListener('click',function(){
    if(cD<PH[cP].days)cD++;else if(cP<PH.length-1){cP++;cD=1;}
    wC=0;draw();window.scrollTo(0,0);
  });
}

draw();
</script>
